# Build fm1-txtr for the FM-1: the engine's tests, the app in fm1-base's host simulator, then the firmware
# package (build/fm1-txtr.fwsc) with JieLi's toolchain and SDK. The package is attached to the run as an artifact.
name: Firmware
on:
  push:
    branches: [main, fm1-device]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (fonts)
        run: pip install Pillow fonttools
      - name: Libraries JieLi's clang 4.0.1 links against
        run: sudo apt-get install -y libtinfo5 libncurses5 || true
      - name: Cache the toolchain and the SDK
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-${{ hashFiles('fm1-base/tools/get_toolchain.sh', 'fm1-base/bsp/tools/get_sdk.sh') }}
      - name: JieLi toolchain
        run: test -x ~/.jieli/toolchain/pi32v2/bin/clang || sh fm1-base/tools/get_toolchain.sh ~/.jieli
      - name: JieLi AC79 SDK (the three files the package uses)
        run: test -f ~/.jieli/ac79-sdk/cpu/wl82/tools/uboot.boot || sh fm1-base/bsp/tools/get_sdk.sh ~/.jieli/ac79-sdk
      - name: Engine tests
        run: make test
      - name: The app in the host simulator
        run: |
          python3 fm1-base/tools/build.py . --host
          build/host/fm1-txtr_host tests/fm1/basic.txt build/host | tee build/host/sim.txt
          ! grep -q "EXPECTATIONS FAILED" build/host/sim.txt
      - name: Firmware package
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/.jieli/ac79-sdk
        run: python3 fm1-base/tools/build.py . | tee build/firmware-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-txtr-firmware
          path: |
            build/*.fwsc
            build/fm1-txtr.bin
            build/firmware-build.txt
            build/host/*.png
          if-no-files-found: error
